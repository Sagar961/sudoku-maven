apiVersion: apps/v1
kind: Deployment

metadata:
  name: sudoku

spec:
  replicas: 1

  selector:
    matchLabels:
      app: sudoku

  template:
    metadata:
      labels:
        app: sudoku

    spec:
      containers:
        - name: sudoku

          image: sagar961/sudoku:latest

          ports:
            - containerPort: 8081

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "200m"
              memory: "256Mi"
